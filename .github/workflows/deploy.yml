name: Deploy site

on:
  push:
    branches: [main]      # run on every push to main
  workflow_dispatch:      # adds a "Run workflow" button for manual deploys

# Needed so the job can request the OIDC token from GitHub
permissions:
  id-token: write
  contents: read

# Never run two deploys at the same time; queue them instead
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::056580203533:role/marcramos-site-github-deploy
  S3_BUCKET: aws-s3-marklar-website-056580203533-eu-north-1-an
  CLOUDFRONT_DISTRIBUTION_ID: E8W68RA85EPDT

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        run: npm run build

      - name: Save the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    needs: build          # only runs if the build succeeded
    runs-on: ubuntu-latest
    steps:
      - name: Get the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Log in to AWS (OIDC, temporary credentials)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3 (mirror _site, remove old files)
        run: aws s3 sync _site "s3://${S3_BUCKET}" --delete

      - name: Refresh the CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/*"